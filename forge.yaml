name: golden-register

artifactStorePath: .forge/artifact-store.yaml

build: []

# The stages the pipeline drives. Each one is the forge-register CLI, which
# is how the pipeline stays the index's only writer.
test:
  - name: process
    runner: go://generic-test-runner
    spec:
      command: forge-register
      args: [process]

  - name: evaluate
    runner: go://generic-test-runner
    spec:
      command: forge-register
      args: [evaluate]

  - name: status
    runner: go://generic-test-runner
    spec:
      command: forge-register
      args: [status]
