# The remote compute runner: the github compute engine dispatches this
# workflow with a unique marker and the target script, then correlates
# the run by the marker in its name and polls it to conclusion.
name: ci-runner
run-name: run ${{ inputs.marker }}

on:
  workflow_dispatch:
    inputs:
      marker:
        description: correlation marker echoed in the run name
        required: true
      script:
        description: target commands executed at the workspace root
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/alexandremahdhaoui/forge:v0.45.48
    steps:

      - name: Restore the tool store
        id: tool-store
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/forge
          key: tool-store-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tool-store-${{ runner.os }}-

      - name: Check out the workspace around this repo
        run: |
          git config --global url."https://x-access-token:${{ secrets.FORGE_CI_GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          forge clone git@github.com:alexandremahdhaoui/golden-factory.git .

      - name: Run the targets
        run: |
          for d in */; do [ -f "$d.envrc" ] || touch "$d.envrc"; done
          ${{ inputs.script }}

      - name: Name the tool store by its content
        id: tool-store-key
        if: always()
        run: |
          echo "key=$(find ~/.cache/forge -mindepth 1 -maxdepth 3 2>/dev/null | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save the tool store
        if: always() && steps.tool-store.outputs.cache-matched-key != format('tool-store-{0}-{1}', runner.os, steps.tool-store-key.outputs.key)
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/forge
          key: tool-store-${{ runner.os }}-${{ steps.tool-store-key.outputs.key }}
