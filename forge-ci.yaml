name: golden-register

artifactStorePath: .forge-ci/artifact-store.yaml

repos:
  - name: golden-register
    url: git@github.com:alexandremahdhaoui/golden-register.git
    ref: main

managers:
  - alias: local
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-manager-local"
    spec:
      statePath: .forge-ci/manager-local.json

  # Realizes the GitHub surface the actions engine declares: converged
  # workflow files on this checkout, sealed Actions secrets, workflow
  # enablement. It reads GITHUB_TOKEN from the environment (.envrc).
  - alias: github
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-manager-github"
    spec:
      statePath: .forge-ci/manager-github.json
      tokenEnv: FORGE_CI_GITHUB_TOKEN

engines:
  - alias: here
    type: compute
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-compute-local"
    manager: local

  # The GitHub surface, owned by the engine that uses it: every workflow
  # file under .github/workflows is declared from this spec (templated;
  # `content:` on an entry overrides verbatim), beside the Actions
  # secrets and enablement. Bootstrap provisions the lot, every apply
  # re-converges it - a hand-edited workflow drifts back to this spec.
  # No substage routes here yet; the stages below stay on local compute.
  - alias: actions
    type: compute
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-compute-github"
    manager: github
    spec:
      repo: alexandremahdhaoui/golden-register
      dir: golden-register
      # Every job runs in the published toolchain, so nothing here builds
      # forge from source. The version is the one the register carries on
      # internal:ghcr.io/alexandremahdhaoui/forge, written by proof with the
      # revision that produced it; read it with forge-register status and
      # never typed here.
      #
      # The three pieces that used to be missing exist now: the factory
      # declares toolchain.image, sync resolves the track and persists the
      # full reference into the generated .forge/toolchain-image at the
      # workspace root, and containerFile reads it there at declare time.
      # This pipeline runs with --root .., so the file resolves at the
      # workspace root the sync wrote it into.
      containerFile: .forge/toolchain-image
      # No setup actions. The image carries the toolchain, and a setup-go
      # step would install a second one over it.
      workspace:
        # One command stands the whole workspace up. forge is already on PATH
        # inside the image, so the seed no longer needs a pinned go run of a
        # forge-factory built from source.
        #
        # A container carries tools and not members, so this step stays: it
        # is the only thing that puts the repos on disk.
        #
        # The toolchainScript that was here did (cd forge && go install
        # ./cmd/forge), and forge is not a member of golden-factory - it is a
        # verbatim go dependency. So that line could never work from this
        # workspace, and every scheduled run died in it.
        bootstrapCommand: forge clone git@github.com:alexandremahdhaoui/golden-factory.git .
      secrets:
        - name: FORGE_CI_GITHUB_TOKEN
          fromEnv: FORGE_CI_GITHUB_TOKEN
        - name: FORGE_CI_DISPATCH_TOKEN
          fromEnv: FORGE_CI_DISPATCH_TOKEN
      workflows:
        - name: intake
          kind: command
          header: |
            # Scheduled security intake: run the register pipeline so a fresh OSV
            # snapshot re-evaluates every track and raises any advisory that is due.
            #
            # UNEXERCISED: written where Actions cannot run. It needs one secret,
            # FORGE_CI_GITHUB_TOKEN - a token that can read every workspace member and push
            # to this repo - because the pipeline builds the whole playground
            # workspace around this checkout.
          # Weekly, Monday morning: the register advances by policy, not by
          # calendar - an advisory on a resolved version fails a consumer
          # sync the moment it lands, whatever this cadence says, so the
          # cron only paces adoption of new versions.
          cron: "0 6 * * 1"
          # A dispatched or scheduled run has no audience here: whoever caused
          # it is watching another repo's checks, or nobody typed it at all.
          reportFailure: true
          job: apply
          stepName: Run the register pipeline
          secret: FORGE_CI_GITHUB_TOKEN
          push: true
          command: |
            cd golden-register
            touch .envrc
            forge-ci apply --config forge-ci.yaml --root ..
        - name: request
          kind: command
          header: |
            # The remote consumer's request door: a repository_dispatch of type
            # admission-request files the request into the register's store, where the
            # next pipeline run answers it under the same policy as everything else.
            # A request is untrusted input whoever files it and however it arrives.
            #
            # UNEXERCISED: written where Actions cannot run. It needs the same
            # FORGE_CI_GITHUB_TOKEN as intake. A consumer fires it with:
            #
            #   forge-register add go:github.com/x/pkg --reason "..." \
            #     --dispatch <owner>/golden-register
          events: [admission-request]
          # A dispatched or scheduled run has no audience here: whoever caused
          # it is watching another repo's checks, or nobody typed it at all.
          reportFailure: true
          job: file
          stepName: File the request
          secret: FORGE_CI_GITHUB_TOKEN
          payloadEnv: [ecosystem, package, track, version, requester, reason]
          command: |
            cd golden-register
            forge-register add \
              ${TRACK:+--track "$TRACK"} \
              ${VERSION:+--version "$VERSION"} \
              ${REQUESTER:+--requester "$REQUESTER"} \
              --reason "$REASON" \
              "$ECOSYSTEM:$PACKAGE"
        - name: propagate
          kind: fan-out
          header: |
            # A new register tag is news every consumer wants: tell them, so their
            # pipelines re-sync against it instead of waiting for a human.
            #
            # UNEXERCISED: written where Actions cannot run. It needs one secret,
            # FORGE_CI_DISPATCH_TOKEN - a token that can send repository_dispatch to the
            # consumer repos named below and nothing else.
          tagPattern: "v*"
          secret: FORGE_CI_DISPATCH_TOKEN
          eventType: register-tag
          consumers: [golden-factory, golden-register-consumer]
        - name: release
          kind: release
          # It stands the workspace up to reach the toolchain, and that clone
          # reaches private members.
          secret: FORGE_CI_GITHUB_TOKEN
      runner:
        name: ci-runner
        secret: FORGE_CI_GITHUB_TOKEN
        setupScript: |
          for d in */; do [ -f "$d.envrc" ] || touch "$d.envrc"; done

  # The pipeline's own run records live in golden-state like every other
  # pipeline's, kept apart from the index this pipeline writes: a run is not
  # a register record.
  - alias: pipeline-state
    type: state
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-state-git"
    manager: local
    spec:
      path: golden-state

  - alias: on-change
    type: trigger
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-trigger-watch"
    manager: local
    spec:
      watch: ["golden-register"]

  - alias: all-pass
    type: promotion
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-promotion-all"
    manager: local

  # Tag-on-green: a canary-green run tags and publishes on its own, which is
  # what makes a mint reach consumers - the propagate fan-out below fires on
  # the tag, and without this engine that loop was dead. The version is
  # derived from the last tag (never typed), the engine speaks the GitHub
  # API over HTTP with the named token - there is no gh dependency - and a
  # re-run of an already-published revision converges instead of failing.
  - alias: publish
    type: artifact
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-artifact-release"
    manager: local
    spec:
      repo: alexandremahdhaoui/golden-register
      tokenEnv: FORGE_CI_GITHUB_TOKEN

state: pipeline-state
triggers: [on-change]

targets:
  - alias: process
    forge: test run process
    in: [golden-register]

  - alias: evaluate
    forge: test run evaluate
    in: [golden-register]

  # The canary syncs the playground workspace against the candidate index
  # and runs a consumer gate. Red means nothing mints and nothing publishes.
  - alias: canary
    forge: test run canary
    in: [golden-register]

stages:
  - name: process
    promotion: all-pass
    substages:
      - name: default
        engine: here
        manager: local
        targets: [process]

  - name: evaluate
    promotion: all-pass
    substages:
      - name: default
        engine: here
        manager: local
        targets: [evaluate]

  - name: canary
    promotion: all-pass
    substages:
      - name: default
        engine: here
        manager: local
        targets: [canary]

  # The release is a substage naming the artifact engine, in a stage of its
  # own after the canary: substages of one stage run at the same time, so a
  # publish beside the canary would tag while the canary was still deciding.
  # Only a canary-green index state is a claim consumers may rely on, and
  # stage order is what says so.
  #
  # The revision is minted before the first stage, by the evaluate phase. It
  # is the run's identity and not its verdict; what says this index state was
  # proven is the canary's run record and this release.
  - name: release
    promotion: all-pass
    substages:
      - name: publish
        engine: publish
        manager: local
